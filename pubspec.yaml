name: reine_creation
description: "Madame ZANA Couture - gestion complète d'un atelier de couture"
publish_to: 'none'
version: 1.6.0+7

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Base de données locale + état
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  crypto: ^3.0.3

  # Sécurité
  local_auth: ^2.3.0

  # Photos, vidéos, messagerie (WhatsApp / SMS)
  image_picker: ^1.1.2
  video_player: ^2.9.1
  url_launcher: ^6.3.0

  # Voix de bienvenue (synthèse vocale)
  flutter_tts: ^4.2.0

  # Notifications locales
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Dates, PDF, Excel, graphiques, agenda, QR, signature, partage, sauvegarde
  intl: ">=0.19.0 <1.0.0"
  pdf: ^3.11.0
  printing: ^5.13.0
  excel: ^4.0.6
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2
  qr_flutter: ^4.1.0
  signature: ^5.5.0
  share_plus: ^9.0.0
  file_picker: ^8.0.7
  archive: ^3.6.1

  # Catalogue partagé entre tous les téléphones (Firebase)
  firebase_core: ">=3.8.0 <7.0.0"
  cloud_firestore: ">=5.6.0 <7.0.0"
  firebase_auth: ">=5.4.0 <7.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
