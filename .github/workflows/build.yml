name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Préparer le projet Android
        run: |
          flutter create --platforms=android --org com.reinecreation --project-name reine_creation .
          python3 tools/patch_android.py
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: madame-zana-couture-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publier la version (mise à jour de tous les téléphones)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk MadameZANACouture.apk
          gh release delete "v$V" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$V" MadameZANACouture.apk \
            --title "Madame ZANA Couture $V" \
            --notes-file RELEASE_NOTES.md --latest
